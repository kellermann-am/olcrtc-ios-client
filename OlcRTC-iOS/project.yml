name: OlcRTCClient
options:
  bundleIdPrefix: ru.pasklove
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    OTHER_LDFLAGS: "-lresolv"
targets:
  OlcRTCClient:
    type: application
    platform: iOS
    sources:
      - Sources/OlcRTCApp
    info:
      path: Sources/OlcRTCApp/Info.plist
      properties:
        CFBundleDisplayName: OlcRTC
        CFBundleURLTypes:
          - CFBundleURLName: ru.pasklove.olcrtc
            CFBundleURLSchemes:
              - olcrtc
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: Sources/OlcRTCApp/OlcRTCClient.entitlements
      properties: {}
    dependencies:
      - framework: Frameworks/Mobile.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.pasklove.olcrtc
  OlcRTCAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/OlcRTCAppTests
    dependencies:
      - target: OlcRTCClient
