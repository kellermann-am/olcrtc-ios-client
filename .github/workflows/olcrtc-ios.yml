name: OlcRTC iOS

on:
  workflow_dispatch:
  push:
    paths:
      - "OlcRTC-iOS/**"
      - "README.md"
      - ".github/workflows/olcrtc-ios.yml"

permissions:
  contents: read

concurrency:
  group: olcrtc-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.IOS_P12_BASE64 != '' }}
    defaults:
      run:
        working-directory: OlcRTC-iOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Install tools
        run: |
          brew install xcodegen
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build Mobile.xcframework
        run: |
          chmod +x Scripts/build-mobile-xcframework.sh
          ./Scripts/build-mobile-xcframework.sh

      - name: Download Libbox.xcframework
        run: |
          chmod +x Scripts/download-libbox-xcframework.sh
          ./Scripts/download-libbox-xcframework.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build simulator app
        run: |
          xcodebuild \
            -project OlcRTCClient.xcodeproj \
            -scheme OlcRTCClient \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project OlcRTCClient.xcodeproj \
            -scheme OlcRTCClient \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          chmod +x Scripts/package-unsigned-ipa.sh
          Scripts/package-unsigned-ipa.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OlcRTCClient-unsigned-ipa
          path: OlcRTC-iOS/build/ipa/OlcRTCClient-unsigned.ipa
          if-no-files-found: error

      - name: Import signing assets
        if: env.HAS_SIGNING == 'true'
        env:
          P12_B64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          APP_PROFILE_B64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          EXT_PROFILE_B64: ${{ secrets.IOS_EXT_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$P12_B64"         | base64 --decode > "$RUNNER_TEMP/signing/cert.p12"
          printf '%s' "$APP_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/signing/app.mobileprovision"
          printf '%s' "$EXT_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/signing/ext.mobileprovision"

          KEYCHAIN="$RUNNER_TEMP/olcrtc.keychain-db"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing/cert.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign IPA
        if: env.HAS_SIGNING == 'true'
        run: |
          chmod +x Scripts/resign-ipa.sh
          IN_IPA="$PWD/build/ipa/OlcRTCClient-unsigned.ipa" \
          OUT_IPA="$PWD/build/ipa/OlcRTCClient-signed.ipa" \
          APP_PROFILE="$RUNNER_TEMP/signing/app.mobileprovision" \
          EXT_PROFILE="$RUNNER_TEMP/signing/ext.mobileprovision" \
          KEYCHAIN="$RUNNER_TEMP/olcrtc.keychain-db" \
          Scripts/resign-ipa.sh

      - name: Upload signed IPA
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OlcRTCClient-signed-ipa
          path: OlcRTC-iOS/build/ipa/OlcRTCClient-signed.ipa
          if-no-files-found: error

      - name: Test URI parser
        run: |
          xcodebuild \
            -project OlcRTCClient.xcodeproj \
            -scheme OlcRTCAppTests \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            test
